name: Flyway Baseline

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v1

      - name: Baseline Aiven database
        run: |
          flyway \
            -url="${{ secrets.FLYWAY_URL }}" \
            -user="${{ secrets.FLYWAY_USER }}" \
            -password="${{ secrets.FLYWAY_PASSWORD }}" \
            -baselineVersion=1 \
            -baselineDescription="Existing FlySmart database" \
            baseline