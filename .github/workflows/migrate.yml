name: Flyway Database Migration

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # BETA
  # =========================
  beta:
    runs-on: ubuntu-latest

    environment: beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v1

      - name: Run Flyway migration - Beta
        run: |
          flyway \
            -url="${{ secrets.FLYWAY_URL }}" \
            -user="${{ secrets.FLYWAY_USER }}" \
            -password="${{ secrets.FLYWAY_PASSWORD }}" \
            -locations="filesystem:sql/migrations" \
            migrate


  # =========================
  # PRODUCTION
  # =========================
  prod:
    needs: beta
    runs-on: ubuntu-latest

    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v1

      - name: Run Flyway migration - Production
        run: |
          flyway \
            -url="${{ secrets.FLYWAY_URL }}" \
            -user="${{ secrets.FLYWAY_USER }}" \
            -password="${{ secrets.FLYWAY_PASSWORD }}" \
            -locations="filesystem:sql/migrations" \
            migrate