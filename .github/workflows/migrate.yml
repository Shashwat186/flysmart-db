name: Flyway Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select database environment"
        required: true
        type: choice
        options:
          - beta
          - prod

jobs:
  migrate:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v1

      - name: Run Flyway migration
        run: |
          flyway \
            -url="${{ secrets.FLYWAY_URL }}" \
            -user="${{ secrets.FLYWAY_USER }}" \
            -password="${{ secrets.FLYWAY_PASSWORD }}" \
            -locations="filesystem:sql/migrations" \
            migrate